name: Bug report
description: The launcher, a diagnostic or a documented behavior is not working as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please paste output exactly and do not attach NVIDIA files.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `cuda-legacy --version`.
      placeholder: cuda-legacy-compat 0.2.22
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened. Quote the docs section if relevant.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The command you ran and its full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: GPU and driver
      description: Output of `nvidia-smi --query-gpu=name,compute_cap,driver_version,memory.total --format=csv`.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: operating system, Python version, PyTorch version
