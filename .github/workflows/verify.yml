name: Verify project and site

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify site and project
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Generate project context
        run: make context
      - name: Run release checks
        run: make check
      - name: Lint the installer
        run: shellcheck -s sh site/install.sh
      - name: Run test suite
        run: make test

